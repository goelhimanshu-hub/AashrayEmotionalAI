<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aashray — A companion for the hard moments</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #161d27;
    --surface: #1f2933;
    --surface-2: #26323d;
    --accent: #e3a868;
    --accent-soft: rgba(227,168,104,0.14);
    --text: #edeff3;
    --text-muted: #8ca0ac;
    --urgent: #e2897a;
    --urgent-soft: rgba(226,137,122,0.12);
    --border: rgba(255,255,255,0.08);
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
  }

  #app{
    display:flex;
    flex-direction:column;
    height:100%;
    max-width:640px;
    margin:0 auto;
    position:relative;
    overflow:hidden;
  }

  /* --- signature element: the lamp --- */
  .lamp{
    position:absolute;
    top:-120px;
    left:50%;
    transform:translateX(-50%);
    width:360px;
    height:360px;
    border-radius:50%;
    background:radial-gradient(circle, var(--accent-soft) 0%, rgba(227,168,104,0) 70%);
    pointer-events:none;
    animation: breathe 19s ease-in-out infinite;
    z-index:0;
  }
  @keyframes breathe{
    0%{ transform:translateX(-50%) scale(0.85); opacity:0.6; }
    21%{ transform:translateX(-50%) scale(1.05); opacity:1; }
    58%{ transform:translateX(-50%) scale(1.05); opacity:1; }
    100%{ transform:translateX(-50%) scale(0.85); opacity:0.6; }
  }
  @media (prefers-reduced-motion: reduce){
    .lamp{ animation:none; opacity:0.8; }
  }

  header{
    position:relative;
    z-index:1;
    padding:28px 24px 18px;
    text-align:center;
    border-bottom:1px solid var(--border);
    background:linear-gradient(to bottom, rgba(22,29,39,0.4), var(--bg) 90%);
  }
  header h1{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:28px;
    letter-spacing:0.2px;
    margin:0 0 6px;
    color:var(--text);
  }
  header p{
    margin:0;
    font-size:13px;
    color:var(--text-muted);
    letter-spacing:0.2px;
  }
  .reset-btn{
    position:absolute;
    top:24px;
    right:20px;
    background:none;
    border:1px solid var(--border);
    color:var(--text-muted);
    font-size:12px;
    padding:6px 12px;
    border-radius:20px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .reset-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .reset-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  main{
    flex:1;
    overflow-y:auto;
    padding:20px 20px 8px;
    z-index:1;
    scroll-behavior:smooth;
  }

  .msg{
    max-width:82%;
    margin-bottom:14px;
    padding:12px 16px;
    border-radius:16px;
    line-height:1.55;
    font-size:14.5px;
    white-space:pre-wrap;
    animation: rise 0.35s ease both;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .msg{ animation:none; }
  }
  .msg.bot{
    background:var(--surface);
    border:1px solid var(--border);
    border-bottom-left-radius:4px;
    margin-right:auto;
  }
  .msg.user{
    background:var(--accent-soft);
    border:1px solid rgba(227,168,104,0.25);
    border-bottom-right-radius:4px;
    margin-left:auto;
    color:var(--text);
  }
  .msg.fallback{
    background:var(--urgent-soft);
    border:1px solid rgba(226,137,122,0.3);
  }

  .typing{
    font-size:13px;
    color:var(--text-muted);
    padding:0 20px 8px;
    font-style:italic;
  }

  .resources{
    z-index:1;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    padding:10px 20px;
    border-top:1px solid rgba(226,137,122,0.25);
    background:var(--surface-2);
  }
  .resources a{
    font-size:12px;
    color:var(--text);
    text-decoration:none;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--border);
    padding:6px 10px;
    border-radius:20px;
    white-space:nowrap;
    transition:border-color 0.15s ease;
  }
  .resources a b{ color:var(--urgent); font-weight:600; }
  .resources a:hover{ border-color:var(--urgent); }
  .resources a:focus-visible{ outline:2px solid var(--urgent); outline-offset:2px; }

  .composer{
    z-index:1;
    display:flex;
    gap:10px;
    padding:14px 20px 20px;
    background:var(--surface-2);
    border-top:1px solid var(--border);
  }
  textarea{
    flex:1;
    resize:none;
    max-height:120px;
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    padding:12px 14px;
    border-radius:14px;
    line-height:1.4;
  }
  textarea:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  textarea::placeholder{ color:var(--text-muted); }

  button.send{
    background:var(--accent);
    color:#20140a;
    border:none;
    border-radius:14px;
    padding:0 20px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:opacity 0.15s ease;
  }
  button.send:disabled{ opacity:0.5; cursor:default; }
  button.send:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }

  footer.note{
    z-index:1;
    text-align:center;
    font-size:11px;
    color:var(--text-muted);
    padding:0 20px 14px;
    background:var(--surface-2);
  }

  main::-webkit-scrollbar{ width:8px; }
  main::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.1); border-radius:8px; }
</style>
</head>
<body>

<div id="app">
  <div class="lamp" aria-hidden="true"></div>

  <header>
    <button class="reset-btn" id="resetBtn" type="button">New conversation</button>
    <h1>Aashray</h1>
    <p>a companion for the hard moments — not a clinician</p>
  </header>

  <main id="messages" aria-live="polite"></main>
  <div class="typing" id="typing" style="display:none;">Aashray is typing…</div>

  <div class="resources">
    <a href="tel:14416"><b>Tele-MANAS</b> · 14416</a>
    <a href="tel:9152987821"><b>iCall</b> · 91529 87821</a>
    <a href="tel:112"><b>Emergency</b> · 112</a>
  </div>

  <div class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Say whatever's on your mind…" aria-label="Message"></textarea>
    <button class="send" id="sendBtn" type="button">Send</button>
  </div>

  <footer class="note">Aashray is an AI companion, not a substitute for professional care.</footer>
</div>

<script>
const SYSTEM_PROMPT = `You are Aashray, an empathetic, safe, supportive Mental Health AI Companion. You are NOT a licensed psychiatrist, psychologist, or medical professional. You cannot diagnose or prescribe. Your purpose is emotional support, active listening, basic coping strategies, and gentle conversational screening.

TONE: Empathetic and validating — acknowledge feelings before offering anything else. Warm, non-judgmental, conversational (like a supportive peer or trained crisis counselor), never robotic or clinical. Short paragraphs, no bulleted advice lists unless asked. Ask at most one question at a time.

CORE RESPONSIBILITIES:
- Active listening: reflect back what you're hearing.
- Coping tools: offer small, gentle, evidence-based techniques (4-7-8 breathing, 5-4-3-2-1 grounding, journaling prompts) — never techniques involving pain, physical discomfort, or anything mimicking self-harm (no ice cubes, rubber bands, cold water, drawing on skin).
- Screening: only if the user is open to it, one question at a time. Never state or imply a diagnosis, even softly.

STRICT GUARDRAILS:
1) SUICIDE / SELF-HARM — the instant a user mentions suicide, wanting to die, self-harm, or that others would be better off without them, respond with warmth AND immediately include this exact resource line: "Please call Tele-MANAS at 14416 or 1-800-891-4416 (free, 24/7, many Indian languages), or iCall at 9152987821 (Mon–Sat, 8 AM–10 PM). If this is a life-threatening emergency, please call 112 or go to the nearest emergency room." Do this even if the user seems to be joking or minimizing it.
2) HARM TO OTHERS — never validate or help with wanting to hurt someone else. State plainly you can't help with that and urge immediate professional help.
3) NO DIAGNOSIS — if asked "do I have depression/anxiety/bipolar/etc," say the feelings described are common in that condition but you're an AI and can't diagnose, and encourage seeing a licensed therapist or doctor.
4) NO MEDICAL ADVICE — never advise on medications, dosages, or stopping medication. Refer to their prescribing doctor.

ESCALATION VARIANTS:
- AMBIGUOUS RISK (e.g. "what's the point," "everyone would be fine without me," "I feel like disappearing" — no explicit suicide/self-harm word): don't wait for clearer language. Ask directly and caringly: "Are you having thoughts of suicide, or of hurting yourself?" If yes, go to guardrail #1 in full. If no/unclear, stay with them, validate, offer one small grounding step, and mention gently that Tele-MANAS (14416) is there 24/7 even without a crisis.
- REPEATED CRISIS MENTIONS (guardrail #1 already triggered earlier this conversation, or thoughts described as constant): don't just repeat the same script — escalate. Ask directly if they're safe right now and if someone is with them, and urge calling Tele-MANAS right now rather than later, plus 112 if in immediate danger.
- NON-SUICIDAL SELF-HARM (cutting/burning etc. as coping, no stated suicidal intent): take it seriously, don't minimize as "just" coping, still check for suicidal ideation, then offer Tele-MANAS (14416) / iCall (9152987821) and encourage a trusted adult or professional. Never suggest sensory substitutes (ice, rubber bands, cold water, drawing on skin).
- ABUSE (domestic, sexual, child abuse disclosed): validate without demanding graphic detail, say plainly it isn't their fault. Offer: Women Helpline 181 (24/7), NCW Women Helpline 14490, Childline 1098 if a child is in danger, and 112 if in immediate danger. Never promise confidentiality or predict what authorities will do. Don't attempt to build a detailed safety/escape plan yourself.
- EATING DISORDERS / DISORDERED EATING: validate distress without commenting on body size, weight, or specific behaviors. Never give calorie counts, meal plans, or weight targets. Encourage a doctor or eating-disorder specialist; mention Tele-MANAS (14416) as a starting point. Never invent a reason (trauma, relationship, life event) for why they restrict/binge/purge — only reflect what they've actually said.
- PANIC ATTACKS / ACUTE ANXIETY: stay calm and concrete. Reassure that panic attacks feel dangerous but pass and aren't themselves dangerous. Walk through grounding (5-4-3-2-1 or slow counted breathing) one step at a time. If it's a first-ever episode or symptoms are unusual (chest pain, one-sided numbness, fainting), gently suggest medical care or 112 to rule out a medical emergency.

CONVERSATION FLOW: assess the emotion → validate → explore with one gentle open question OR offer one small grounding exercise → keep pacing slow, short paragraphs. Escalate into the matching guardrail the moment risk language appears, even mid-conversation.`;

// ============================================================
// PASTE YOUR GEMINI API KEY BELOW BEFORE DEPLOYING.
// Get one free at https://aistudio.google.com/apikey (no card needed).
// WARNING: anyone who views this page's source can see this key.
// Check your AI Studio console for which model names are currently
// on the free tier for your account — gemini-2.5-flash is a safe
// default as of mid-2026. Delete/rotate the key once graded.
// ============================================================
const API_URL = "/.netlify/functions/chat";

const messagesEl = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const typingEl = document.getElementById('typing');
const resetBtn = document.getElementById('resetBtn');

let history = [];

function addMessage(role, text, isFallback){
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot') + (isFallback ? ' fallback' : '');
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function startConversation(){
  messagesEl.innerHTML = '';
  history = [];
  const greeting = "Hi, I'm Aashray. I'm here to listen, whatever's going on. There's no need to explain everything at once — just start wherever feels right.";
  addMessage('assistant', greeting);
  history.push({ role: 'assistant', content: greeting });
}

function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

// Gemini expects turns as {role:'user'|'model', parts:[{text}]}, alternating,
// starting with 'user'. Our local greeting (history[0]) is synthetic UI-only
// text the model never needs to see, so it's dropped here.
function toGeminiContents(hist){
  return hist.slice(1).map(m => ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.content }]
  }));
}

async function callGemini(){
  const maxAttempts = 3;
  let lastErr;
  for(let attempt = 1; attempt <= maxAttempts; attempt++){
    try{
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: toGeminiContents(history),
          systemPrompt: SYSTEM_PROMPT
        })
      });

      if(response.status === 429 || response.status === 503){
        if(attempt < maxAttempts){ await sleep(attempt * 1200); continue; }
        const e = new Error('overloaded'); e.kind = 'overloaded'; throw e;
      }

      if(!response.ok){
        const e = new Error('Request failed: ' + response.status); e.kind = 'other'; throw e;
      }

      const data = await response.json();

      if(data.promptFeedback && data.promptFeedback.blockReason){
        const e = new Error('blocked'); e.kind = 'blocked'; throw e;
      }

      const candidate = data.candidates && data.candidates[0];
      const parts = (candidate && candidate.content && candidate.content.parts) || [];
      const reply = parts.map(p => p.text || '').join('').trim();

      if(!reply){
        if(candidate && candidate.finishReason === 'SAFETY'){
          const e = new Error('blocked'); e.kind = 'blocked'; throw e;
        }
        const e = new Error('Empty response'); e.kind = 'other'; throw e;
      }
      return reply;

    }catch(err){
      lastErr = err;
      if(err.kind === 'overloaded' || err.kind === 'other' || err.kind === 'blocked') throw err;
      if(attempt < maxAttempts){ await sleep(attempt * 1200); continue; }
      lastErr.kind = 'network';
      throw lastErr;
    }
  }
  throw lastErr;
}

async function sendMessage(userText){
  history.push({ role: 'user', content: userText });
  addMessage('user', userText);
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  typingEl.style.display = 'block';
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try{
    const reply = await callGemini();
    history.push({ role: 'assistant', content: reply });
    addMessage('assistant', reply);

  }catch(err){
    console.error('Aashray error:', err);
    let fallback;
    if(err.kind === 'overloaded'){
      fallback = "Gemini's servers are a bit overloaded or rate-limited right now — that's on my end, not yours. Please try sending that again in a moment. If you need to talk to someone right now instead of waiting, Tele-MANAS (14416, 24/7) and iCall (9152987821, Mon–Sat 8 AM–10 PM) are both available, and 112 for emergencies.";
    } else if(err.kind === 'blocked'){
      fallback = "My reply just got caught by an automatic safety filter — that can happen with heavy topics like this, and it's a limitation on my end, not a judgment on what you shared. Please don't wait on me for this one: Tele-MANAS (14416, 24/7) or iCall (9152987821, Mon–Sat 8 AM–10 PM) can talk it through properly, and 112 if it's an emergency.";
    } else {
      fallback = "I'm having trouble connecting right now. If you need to talk to someone immediately, Tele-MANAS (14416, 24/7) and iCall (9152987821, Mon–Sat 8 AM–10 PM) are both available right now, and 112 for emergencies.";
    }
    addMessage('assistant', fallback, true);
  }finally{
    sendBtn.disabled = false;
    typingEl.style.display = 'none';
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}

function handleSend(){
  const text = input.value.trim();
  if(!text || sendBtn.disabled) return;
  
  sendMessage(text);
}

sendBtn.addEventListener('click', handleSend);

input.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    handleSend();
  }
});

input.addEventListener('input', function(){
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

resetBtn.addEventListener('click', startConversation);

startConversation();
</script>

</body>
</html>
